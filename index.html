<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이미지 용량 줄이기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>이미지 용량 줄이기</h1>
      <p>사진을 올리면 브라우저에서 바로 용량을 줄여드려요.<br>파일은 서버로 전송되지 않아요.</p>
    </header>

    <main>
      <label class="dropzone" for="fileInput">
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
        <span class="dropzone-icon icon-upload" aria-hidden="true">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
        </span>
        <span class="dropzone-icon icon-done" aria-hidden="true">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>
        </span>
        <span class="spinner" aria-hidden="true"></span>
        <strong id="dropTitle">이미지를 선택하세요</strong>
        <span class="dropzone-hint" id="dropHint" aria-live="polite">여기에 끌어다 놓거나 눌러서 고르세요 · JPG, PNG, WebP</span>
        <span class="dropzone-more">+ 눌러서 사진 더 추가하기</span>
      </label>

      <section class="card settings" aria-labelledby="settingsTitle">
        <h2 id="settingsTitle">설정</h2>

        <div class="field">
          <div class="field-label">
            <label for="quality">품질</label>
            <output id="qualityValue" for="quality">80%</output>
          </div>
          <input type="range" id="quality" min="10" max="100" value="80">
          <div class="range-hint"><span>작은 용량</span><span>높은 화질</span></div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="maxWidth">최대 가로(px)</label>
            <input type="number" id="maxWidth" inputmode="numeric" placeholder="원본 유지">
          </div>
          <div class="field">
            <label for="format">저장 형식</label>
            <select id="format">
              <option value="jpeg">JPG</option>
              <option value="webp">WebP</option>
              <option value="png">PNG</option>
            </select>
          </div>
        </div>
      </section>

      <section class="card results" aria-labelledby="resultsTitle">
        <div class="results-head">
          <h2 id="resultsTitle">결과</h2>
          <button type="button" id="downloadAll" class="btn btn-primary" disabled>전체 다운로드</button>
        </div>

        <ul class="result-list" id="resultList"></ul>

        <p class="empty" id="emptyText">아직 올린 이미지가 없어요.</p>
      </section>
    </main>

    <footer class="footer">모든 처리는 내 기기 안에서만 이루어져요.</footer>
  </div>

  <dialog class="preview" id="preview" aria-labelledby="previewName">
    <div class="preview-head">
      <p class="preview-name" id="previewName"></p>
      <button type="button" class="preview-close" id="previewClose" aria-label="닫기">✕</button>
    </div>
    <div class="preview-stage">
      <img id="previewImg" alt="">
    </div>
    <div class="preview-foot">
      <div class="segmented" role="group" aria-label="비교">
        <button type="button" data-view="original" aria-pressed="false">원본</button>
        <button type="button" data-view="compressed" aria-pressed="true">압축본</button>
      </div>
      <p class="preview-info" id="previewInfo" aria-live="polite"></p>
      <a class="btn btn-primary preview-save" id="previewSave">이 사진 저장</a>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
